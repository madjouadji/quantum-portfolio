name: Publish the quantum portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running deployment is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Build and check the site, then upload it for GitHub Pages.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build the site
        run: python build.py
      - name: Check links, assets and page structure
        run: python check_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # 2) Deploy, in a separate job so the uploaded artifact is registered before deployment starts.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

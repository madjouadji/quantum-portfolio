# status (see [statuses] below):
#   "demonstrated"  Demonstrated in Project: used in a listed project (needs `project` = a project id)
#   "practicing"    Practicing: in regular use, not yet shown in a listed project
#   "learning"      Learning: currently being learned
#   "research"      Doctoral research: area of my PhD research
#   "background"    Academic background: part of my mathematical training
# No percentages or levels.

